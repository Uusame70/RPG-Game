<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50-Step RPG Game</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0e14; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        #game-container { background: #161b22; padding: 25px; border-radius: 12px; width: 100%; max-width: 760px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); border: 1px solid #30363d; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lang-btn { background: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .lang-btn:hover { background: #30363d; }
        .progress-bar { background: #21262d; border-radius: 6px; height: 12px; width: 100%; margin-bottom: 15px; overflow: hidden; }
        .progress-fill { background: #238636; height: 100%; width: 2%; transition: width 0.3s; }
        .stats-bar { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 20px; font-weight: bold; background: #21262d; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; }
        .stat-value { color: #58a6ff; display: block; font-size: 15px; margin-top: 2px; }
        #stage-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; margin-bottom: 5px; }
        #story-text { background: #21262d; padding: 20px; border-radius: 8px; margin-bottom: 20px; font-size: 15px; line-height: 1.7; border-left: 4px solid #58a6ff; min-height: 110px; font-style: italic; }
        .choices-grid { display: flex; flex-direction: column; gap: 10px; }
        button.choice-btn { background: #238636; color: white; border: 1px solid #2ea043; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: left; transition: all 0.2s; position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; font-style: normal; }
        button.choice-btn:hover:not(.disabled) { background: #2ea043; transform: translateX(4px); }
        button.choice-btn.disabled { background: #21262d; color: #484f58; border-color: #30363d; cursor: not-allowed; transform: none; }
        button.choice-btn.timer-active { background: #d29922; border-color: #bb8009; color: #0d1117; font-weight: bold; }
        .duration-badge { font-size: 11px; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; margin-left: 10px; }
        .status-box { margin-top: 15px; font-size: 13px; color: #8b949e; background: #0d1117; padding: 10px; border-radius: 6px; }
        #timer-banner { display: none; background: #9e6a03; color: #fff; padding: 8px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="top-bar">
            <div class="progress-bar" style="margin-bottom:0; flex-grow: 1; margin-right: 15px;"><div id="progress" class="progress-fill"></div></div>
            <button class="lang-btn" onclick="toggleLanguage()">🌐 Lang: <span id="current-lang">EN</span></button>
        </div>
        
        <div class="stats-bar">
            <div><span id="lbl-hp">❤️ HP</span> <span id="hp" class="stat-value">100</span></div>
            <div><span id="lbl-gold">💰 Gold</span> <span id="gold" class="stat-value">20</span></div>
            <div><span id="lbl-mana">⚡ Mana</span> <span id="mana" class="stat-value">30</span></div>
            <div><span id="lbl-potion">🧪 Potion</span> <span id="potion" class="stat-value">1</span></div>
            <div><span id="lbl-time">⏳ Time</span> <span id="game-time" class="stat-value">D1 - 08:00</span></div>
            <div><span id="lbl-real">⏱️ Real</span> <span id="real-time" class="stat-value">00:00</span></div>
        </div>

        <div id="timer-banner"><span id="lbl-timer">⏱️ Performing action...</span> <span id="timer-count">0</span>s</div>
        <div id="stage-title">Stage 1 / 50</div>
        <div id="story-text">Loading...</div>
        <div id="choices-container" class="choices-grid"></div>

        <div class="status-box">
            🎒 <span id="lbl-inv">Inventory</span>: <span id="inventory" style="color:#c9d1d9;">Empty</span>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let audioCtx = null;
        let bgMusicInterval = null;
        let isWaiting = false;
        let realSeconds = 0;
        let realTimerInterval = null;

        let gameState = { step: 1, hp: 100, gold: 20, mana: 30, potions: 1, items: [], day: 1, hour: 8 };

        const uiText = {
            en: {
                hp: "❤️ HP", gold: "💰 Gold", mana: "⚡ Mana", potion: "🧪 Potion",
                time: "⏳ Time", real: "⏱️ Real", inv: "Inventory", emptyInv: "Empty",
                dayPrefix: "D", timerMsg: "⏱️ Performing action... ", reqMissing: " (Requirement Missing)",
                waitBadge: "Wait", hourBadge: "h",
                winTitle: "EPIC VICTORY!", winText: "You completed all 50 stages and became the legendary ruler of the realm!", winBtn: "Restart Game",
                gameOverTitle: "GAME OVER", gameOverText: "Your HP reached 0! Dark forces have prevailed.", retryBtn: "Try Again"
            },
            tr: {
                hp: "❤️ Can", gold: "💰 Altın", mana: "⚡ Mana", potion: "🧪 İksir",
                time: "⏳ Saat", real: "⏱️ Süre", inv: "Envanter", emptyInv: "Boş",
                dayPrefix: "G", timerMsg: "⏱️ Eylem gerçekleştiriliyor... ", reqMissing: " (Gereksinim Eksik)",
                waitBadge: "Bekleme", hourBadge: "Sa",
                winTitle: "DESTANSI ZAFER!", winText: "50 Aşamayı da başarıyla tamamlayıp krallığın efsanevi hükümdarı oldun!", winBtn: "Yeniden Başla",
                gameOverTitle: "ÖLDÜN - GAME OVER", gameOverText: "Canın sıfıra düştü! Karanlık güçler kazandı.", retryBtn: "Yeniden Dene"
            }
        };

        const storyData = {
            s1: {
                en: { title: "Stage 1 / 50: Awakening in the Dungeon", text: "You open your eyes to the burning smell of damp, cold stone. Water drips echoing from the high ceilings of this pitch-black cell. The heavy, rusted iron door is locked tight; muffled footsteps of guards echo outside.", choices: [
                    { text: "1. Inspect the loose, mossy stone on the wall", waitSec: 3, timeAdd: 1, next: "s2", action: () => { if(!gameState.items.includes("Rusty Nail")) gameState.items.push("Rusty Nail"); } },
                    { text: "2. Ram the iron door with your shoulder (-15 HP)", timeAdd: 1, next: "s2", action: () => gameState.hp -= 15 },
                    { text: "3. Search the rotting straw in the corner", waitSec: 5, timeAdd: 2, next: "s2", action: () => { if(!gameState.items.includes("Guard Lockpick")) gameState.items.push("Guard Lockpick"); } }
                ]},
                tr: { title: "Aşama 1 / 50: Zindanda Uyanış", text: "Nemli ve soğuk taşların genzinizi yakan kokusuyla gözlerinizi açıyorsunuz. Zifiri karanlık hücrede yükseklerden damlayan su sesleri yankılanıyor. Ağır paslı demir kapı sürgülü; dışarıdan nöbetçilerin boğuk ayak sesleri geliyor.", choices: [
                    { text: "1. Duvardaki gevşek ve yosunlu taşı söküp incele", waitSec: 3, timeAdd: 1, next: "s2", action: () => { if(!gameState.items.includes("Paslı Çivi")) gameState.items.push("Paslı Çivi"); } },
                    { text: "2. Demir kapıya var gücünle omuz atıp kır (-15 Can)", timeAdd: 1, next: "s2", action: () => gameState.hp -= 15 },
                    { text: "3. Köşedeki çürümüş samanları karıştırıp eşya ara", waitSec: 5, timeAdd: 2, next: "s2", action: () => { if(!gameState.items.includes("Muhafız Maymuncuğu")) gameState.items.push("Muhafız Maymuncuğu"); } }
                ]}
            },
            s2: {
                en: { title: "Stage 2 / 50: Corridor And Chest", text: "You escaped the cell. Flickering yellow torchlight dances along the long, shadowed hallway. In the corner sits an old oak weapon chest bound with iron bands, rotting from humidity.", choices: [
                    { text: "1. Force open the rusted lock on the weapon chest", waitSec: 4, timeAdd: 1, next: "s3", action: () => gameState.gold += 25 },
                    { text: "2. Knock over the mildewed barrel and search inside (+1 Potion)", timeAdd: 1, next: "s3", action: () => gameState.potions += 1 },
                    { text: "3. Sneak through shadows toward the stairs leading up", timeAdd: 1, next: "s3" }
                ]},
                tr: { title: "Aşama 2 / 50: Koridor Ve Sandık", text: "Hücreden kaçmayı başardınız. Uzun koridorda duvarlardaki meşalelerin titrek sarı ışıkları dans ediyor. Köşede nemden yarı çürümüş meşe ağacından eski bir silah sandığı göze çarpıyor.", choices: [
                    { text: "1. Silah sandığının paslı kilidini zorlayarak aç", waitSec: 4, timeAdd: 1, next: "s3", action: () => gameState.gold += 25 },
                    { text: "2. Köşedeki küf kokan varili devirip içini ara (+1 İksir)", timeAdd: 1, next: "s3", action: () => gameState.potions += 1 },
                    { text: "3. Gölgelere sığınarak yukarı çıkan merdivenlere koş", timeAdd: 1, next: "s3" }
                ]}
            },
            s3: {
                en: { title: "Stage 3 / 50: Armory Room", text: "You stand in a vast armory filled with dusty parchment rolls and rusted swords. Torchlight glimmers on the brass buckles of a sturdy leather armor hanging on the wall.", choices: [
                    { text: "1. Equip the leather armor hanging on the wall", waitSec: 6, timeAdd: 2, next: "s4", action: () => { if(!gameState.items.includes("Leather Armor")) gameState.items.push("Leather Armor"); } },
                    { text: "2. Read the glowing ancient magic scroll on the desk (+15 Mana)", timeAdd: 1, next: "s4", action: () => gameState.mana += 15 },
                    { text: "3. Stealthily approach the guard standing by the doorway", timeAdd: 1, next: "s4" }
                ]},
                tr: { title: "Aşama 3 / 50: Cephanelik Odası", text: "Tozlu parşömenler ve paslı kılıçlarla dolu geniş bir cephanelikte duruyorsunuz. Meşale ışığı, duvarda asılı duran sağlam deri zırhın pirinç tokalarında parıldıyor.", choices: [
                    { text: "1. Duvardaki deri zırhı gövdenize oturtup giyin", waitSec: 6, timeAdd: 2, next: "s4", action: () => { if(!gameState.items.includes("Deri Zırh")) gameState.items.push("Deri Zırh"); } },
                    { text: "2. Masadaki parlayan kadim büyü parşömenini oku (+15 Mana)", timeAdd: 1, next: "s4", action: () => gameState.mana += 15 },
                    { text: "3. Sessizce kapının eşiğindeki nöbetçiye yaklaş", timeAdd: 1, next: "s4" }
                ]}
            },
            s4: {
                en: { title: "Stage 4 / 50: Guard Quarters", text: "In a room smelling of sour wine and wood smoke, two burly guards lie passed out at a wooden table. Under a gas lamp in the center lies a heavy iron key temptingly glinting.", choices: [
                    { text: "1. Tiptoe and steal the 'Iron Key' from the table", waitSec: 5, timeAdd: 1, next: "s5", action: () => { if(!gameState.items.includes("Iron Key") && !gameState.items.includes("Demir Anahtar")) gameState.items.push(currentLang==='en'?"Iron Key":"Demir Anahtar"); } },
                    { text: "2. Ambush the sleeping guards (-20 HP, +30 Gold)", timeAdd: 1, next: "s5", action: () => { gameState.hp -= 20; gameState.gold += 30; } },
                    { text: "3. Quietly slip past through the side wooden door", timeAdd: 1, next: "s5" }
                ]},
                tr: { title: "Aşama 4 / 50: Muhafız Odası", text: "Ekşi şarap ve duman kokan odada iki iriyarı muhafız masaya sızmış. Masanın ortasında, lambanın altında davetkar bir şekilde parıldayan ağır demir bir anahtar duruyor.", choices: [
                    { text: "1. 'Demir Anahtar'ı masadan parmak uçlarında çal", waitSec: 5, timeAdd: 1, next: "s5", action: () => { if(!gameState.items.includes("Iron Key") && !gameState.items.includes("Demir Anahtar")) gameState.items.push(currentLang==='en'?"Iron Key":"Demir Anahtar"); } },
                    { text: "2. Uuyan muhafızlara gafil avlayıp saldır (-20 Can, +30 Altın)", timeAdd: 1, next: "s5", action: () => { gameState.hp -= 20; gameState.gold += 30; } },
                    { text: "3. Parmak ucunda yürüyerek yan ahşap kapıdan sıyrıl", timeAdd: 1, next: "s5" }
                ]}
            },
            s5: {
                en: { title: "Stage 5 / 50: Courtyard Exit", text: "The cool night wind strikes your face. You are in the castle's grim courtyard. High above, the full moon illuminates the spiked bars of a massive wrought-iron gate leading to freedom.", choices: [
                    { text: "1. *(Requires: Iron Key)* Unlock the Massive Gate", waitSec: 3, reqItem: ["Iron Key", "Demir Anahtar"], timeAdd: 1, next: "s6" },
                    { text: "2. If you lack the key, head back to Armory", timeAdd: 1, next: "s4" },
                    { text: "3. Jump down from the castle ramparts (-25 HP)", timeAdd: 1, next: "s6", action: () => gameState.hp -= 25 }
                ]},
                tr: { title: "Aşama 5 / 50: Avlu Çıkışı", text: "Gece rüzgarının serinliği yüzünüze çarpıyor. Şatonun kasvetli avlusundasınız. Tepedeki dolunay, dış dünyaya açılan devasa dövme demir kapının parmaklıklarını aydınlatıyor.", choices: [
                    { text: "1. *(Gereksinim: Demir Anahtar)* Devasa Kapıyı Aç", waitSec: 3, reqItem: ["Iron Key", "Demir Anahtar"], timeAdd: 1, next: "s6" },
                    { text: "2. Anahtarın yoksa Cephaneliğe dönüp ara", timeAdd: 1, next: "s4" },
                    { text: "3. Şato surlarının kenarından aşağıya atla (-25 Can)", timeAdd: 1, next: "s6", action: () => gameState.hp -= 25 }
                ]}
            },
            s50: {
                en: { title: "Stage 50 / 50: FINAL - LEGENDARY RULER", text: "Congratulations! You overcame every trial, restored peace to the realm, and etched your name into history with golden letters!", choices: [
                    { text: "🏆 Complete Adventure", next: "win" }
                ]},
                tr: { title: "Aşama 50 / 50: FİNAL - EFSANEVİ HÜKÜMDAR", text: "Tebrikler! Bütün engelleri aştınız, krallığa huzur getirdiniz ve adınızı tarihe altın harflerle yazdırdınız!", choices: [
                    { text: "🏆 Macerayı Başarıyla Tamamla", next: "win" }
                ]}
            }
        };

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'tr' : 'en';
            document.getElementById("current-lang").innerText = currentLang.toUpperCase();
            updateUI();
            showScene("s" + gameState.step);
        }

        function startRealTimer() {
            if (realTimerInterval) clearInterval(realTimerInterval);
            realSeconds = 0;
            const timerEl = document.getElementById("real-time");
            if (timerEl) timerEl.innerText = "00:00";
            
            realTimerInterval = setInterval(() => {
                realSeconds++;
                let min = Math.floor(realSeconds / 60).toString().padStart(2, '0');
                let sec = (realSeconds % 60).toString().padStart(2, '0');
                if (timerEl) timerEl.innerText = `${min}:${sec}`;
            }, 1000);
        }

        function stopRealTimer() {
            if (realTimerInterval) { clearInterval(realTimerInterval); realTimerInterval = null; }
        }

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function startBgMusic() {
            const ctx = getAudioContext();
            if (bgMusicInterval) return;
            const notes = [110.00, 130.81, 146.83, 164.81, 130.81, 98.00];
            let noteIdx = 0;

            bgMusicInterval = setInterval(() => {
                try {
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = notes[noteIdx % notes.length];
                    noteIdx++;
                    gain.gain.setValueAtTime(0.03, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.8);
                } catch(e) {}
            }, 550);
        }

        function playClickSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch(e) {}
        }

        function advanceInGameTime(hoursToAdd) {
            gameState.hour += hoursToAdd;
            while (gameState.hour >= 24) {
                gameState.hour -= 24;
                gameState.day += 1;
            }
        }

        function updateUI() {
            const txt = uiText[currentLang];
            document.getElementById("lbl-hp").innerText = txt.hp;
            document.getElementById("lbl-gold").innerText = txt.gold;
            document.getElementById("lbl-mana").innerText = txt.mana;
            document.getElementById("lbl-potion").innerText = txt.potion;
            document.getElementById("lbl-time").innerText = txt.time;
            document.getElementById("lbl-real").innerText = txt.real;
            document.getElementById("lbl-inv").innerText = txt.inv;

            let displayHp = Math.max(0, gameState.hp);
            document.getElementById("hp").innerText = displayHp;
            document.getElementById("gold").innerText = gameState.gold;
            document.getElementById("mana").innerText = gameState.mana;
            document.getElementById("potion").innerText = gameState.potions;
            document.getElementById("inventory").innerText = gameState.items.length > 0 ? gameState.items.join(", ") : txt.emptyInv;
            
            let formattedHour = (gameState.hour < 10 ? "0" : "") + gameState.hour + ":00";
            document.getElementById("game-time").innerText = txt.dayPrefix + gameState.day + " - " + formattedHour;

            let percent = (gameState.step / 50) * 100;
            document.getElementById("progress").style.width = percent + "%";
        }

        function handleChoiceClick(choice, clickedBtn) {
            if (isWaiting) return;
            startBgMusic();
            playClickSound();

            let waitTime = choice.waitSec || 0;
            if (waitTime > 0) {
                isWaiting = true;
                let banner = document.getElementById("timer-banner");
                let countSpan = document.getElementById("timer-count");
                banner.style.display = "block";
                countSpan.innerText = waitTime;

                let allBtns = document.querySelectorAll("#choices-container button");
                allBtns.forEach(b => b.classList.add("disabled"));
                clickedBtn.classList.add("timer-active");

                let timeLeft = waitTime;
                let timerInterval = setInterval(() => {
                    timeLeft--;
                    countSpan.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        banner.style.display = "none";
                        isWaiting = false;
                        
                        if (choice.timeAdd) advanceInGameTime(choice.timeAdd);
                        if (choice.action) choice.action();
                        showScene(choice.next);
                    }
                }, 1000);
            } else {
                if (choice.timeAdd) advanceInGameTime(choice.timeAdd);
                if (choice.action) choice.action();
                showScene(choice.next);
            }
        }

        function showScene(sceneKey) {
            const txt = uiText[currentLang];

            if (sceneKey === "restart") {
                gameState = { step: 1, hp: 100, gold: 20, mana: 30, potions: 1, items: [], day: 1, hour: 8 };
                sceneKey = "s1";
                startBgMusic();
                startRealTimer();
            }

            if (gameState.hp <= 0 && sceneKey !== "gameOver") {
                sceneKey = "gameOver";
            }

            if (sceneKey === "win") {
                stopRealTimer();
                document.getElementById("stage-title").innerText = txt.winTitle;
                document.getElementById("story-text").innerText = txt.winText;
                let choicesDiv = document.getElementById("choices-container");
                choicesDiv.innerHTML = "";
                let btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = txt.winBtn;
                btn.onclick = () => showScene("restart");
                choicesDiv.appendChild(btn);
                updateUI();
                return;
            }

            if (sceneKey === "gameOver") {
                stopRealTimer();
                document.getElementById("stage-title").innerText = txt.gameOverTitle;
                document.getElementById("story-text").innerText = txt.gameOverText;
                let choicesDiv = document.getElementById("choices-container");
                choicesDiv.innerHTML = "";
                let btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = txt.retryBtn;
                btn.onclick = () => showScene("restart");
                choicesDiv.appendChild(btn);
                updateUI();
                return;
            }

            let rawScene = storyData[sceneKey] || storyData["s1"];
            let scene = rawScene[currentLang] || rawScene['en'];

            if (sceneKey.startsWith("s")) {
                gameState.step = parseInt(sceneKey.replace("s", ""));
            }

            updateUI();

            document.getElementById("stage-title").innerText = scene.title || "Stage";
            document.getElementById("story-text").innerText = scene.text;
            let choicesDiv = document.getElementById("choices-container");
            choicesDiv.innerHTML = "";

            scene.choices.forEach(choice => {
                let btn = document.createElement("button");
                btn.className = "choice-btn";

                let durationText = [];
                if (choice.waitSec) durationText.push(`⏱️ ${choice.waitSec}s ${txt.waitBadge}`);
                if (choice.timeAdd) durationText.push(`⏳ ${choice.timeAdd} ${txt.hourBadge}`);

                let textSpan = document.createElement("span");
                textSpan.innerText = choice.text;

                btn.appendChild(textSpan);
                if (durationText.length > 0) {
                    let badgeSpan = document.createElement("span");
                    badgeSpan.className = "duration-badge";
                    badgeSpan.innerText = durationText.join(" | ");
                    btn.appendChild(badgeSpan);
                }

                let canClick = true;
                if (choice.reqGold && gameState.gold < choice.reqGold) canClick = false;
                if (choice.reqMana && gameState.mana < choice.reqMana) canClick = false;
                if (choice.reqPotion && gameState.potions < choice.reqPotion) canClick = false;
                if (choice.reqItem) {
                    if (Array.isArray(choice.reqItem)) {
                        if (!choice.reqItem.some(i => gameState.items.includes(i))) canClick = false;
                    } else if (!gameState.items.includes(choice.reqItem)) {
                        canClick = false;
                    }
                }

                if (!canClick) {
                    btn.classList.add("disabled");
                    textSpan.innerText += txt.reqMissing;
                } else {
                    btn.onclick = () => handleChoiceClick(choice, btn);
                }

                choicesDiv.appendChild(btn);
            });
        }

        startRealTimer();
        showScene("s1");
    </script>
</body>
</html>
